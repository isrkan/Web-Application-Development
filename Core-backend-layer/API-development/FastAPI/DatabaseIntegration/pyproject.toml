[project]
name = "database-integration"
version = "1.0.0"
description = "Database integration with FastAPI and SQLAlchemy - demonstrating async ORM, CRUD operations, and dependency injection"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "aiomysql>=0.2.0",
    "cryptography>=42.0.0",
    "pydantic>=2.5.0",
    "pymysql>=1.1.2",
]
